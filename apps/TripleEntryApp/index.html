<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple-Entry Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-header">
        <div class="status-indicator">SYSTEM: OPERATIONAL</div>
        <div class="app-title">LEDGER_SYNC // TRIPLE-ENTRY VISUALIZER</div>
    </div>

    <main class="dashboard">
        <section class="input-panel">
            <h3>Record Transaction</h3>
            <div class="input-group">
                <label>Payer</label>
                <input type="text" id="payer" placeholder="e.g. Entity_A">
            </div>
            <div class="input-group">
                <label>Payee</label>
                <input type="text" id="payee" placeholder="e.g. Entity_B">
            </div>
            <div class="input-group">
                <label>Amount (USDC)</label>
                <input type="number" id="amount" placeholder="0.00">
            </div>
            <button id="record-btn">EXECUTE & SIGN</button>
        </section>

        <div class="ledger-comparison">
            
            <div class="ledger-box">
                <div class="ledger-tag">Traditional Double-Entry</div>
                <div class="dual-columns">
                    <div class="ledger-side">
                        <h4>Payer Ledger</h4>
                        <div id="payer-list" class="entry-list"></div>
                    </div>
                    <div class="ledger-side">
                        <h4>Payee Ledger</h4>
                        <div id="payee-list" class="entry-list"></div>
                    </div>
                </div>
                <p class="audit-note">Note: Ledgers are siloed. Information asymmetry high.</p>
            </div>

            <div class="ledger-box highlight">
                <div class="ledger-tag active">Blockchain Triple-Entry</div>
                <h4>Shared Cryptographic Ledger</h4>
                <div id="blockchain-list" class="entry-list"></div>
                <p class="audit-note">Note: Records are immutable, timestamped, and shared.</p>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
