<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit-Logic Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-header">
        <div class="status-indicator">PROTOCOL: V.2.0.5-AUDIT</div>
        <div class="app-title">BLOCK_AUDIT // FULL-CYCLE LEDGER</div>
    </div>

    <main class="dashboard">
        <section class="left-col">
            <div class="card input-panel">
                <h3>Treasury Controls</h3>
                <div class="input-group">
                    <label>Source Address (Your Wallet)</label>
                    <input type="text" id="payer" value="0x8f...E21" readonly>
                </div>
                <div class="input-group">
                    <label>Whitelisted Recipient</label>
                    <select id="payee" class="custom-select">
                        <option value="0x4a2...B92">Inventory Vendor (0x4a2...B92)</option>
                        <option value="0x1b9...F31">Utility Provider (0x1b9...F31)</option>
                        <option value="0x7d4...E08">Payroll Smart Contract (0x7d4...E08)</option>
                        <option value="0xEXTERNAL">External Wallet (Manual Audit Required)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Amount (ETH)</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button id="deposit-btn" style="background: var(--accent);">DEPOSIT</button>
                    <button id="record-btn">EXECUTE TX</button>
                </div>
            </div>

            <div class="card audit-logs">
                <h3>Network Logs (Auditor View)</h3>
                <div id="log-list" class="log-container">
                    <div class="log-entry info">System ready. Waiting for liquidity injection...</div>
                </div>
            </div>
        </section>

        <section class="right-col">
            <div class="ledger-box highlight">
                <div class="ledger-tag active">Consensus Ledger (Triple-Entry)</div>
                <div id="blockchain-list" class="entry-list"></div>
                <div class="ledger-stats">
                    <span>Block Height: <b id="block-height">0</b></span>
                    <span>Treasury Balance: <b id="balance-display">0.00</b> ETH</span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
