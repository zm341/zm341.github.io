<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit-Logic Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-header">
        <div class="status-indicator">PROTOCOL: V.2.0.4-AUDIT</div>
        <div class="app-title">BLOCK_AUDIT // SMART CONTRACT SIMULATOR</div>
    </div>

    <main class="dashboard">
        <section class="left-col">
            <div class="card input-panel">
                <h3>Contract Parameters</h3>
                <div class="input-group">
                    <label>Source Address</label>
                    <input type="text" id="payer" value="0x8f...E21" readonly>
                </div>
                <div class="input-group">
                    <label>Recipient Address</label>
                    <input type="text" id="payee" placeholder="e.g. 0x4a...B92">
                </div>
                <div class="input-group">
                    <label>Transfer Amount (ETH)</label>
                    <input type="number" id="amount" placeholder="0.00">
                </div>
                <button id="record-btn">VALIDATE & EXECUTE</button>
            </div>

            <div class="card audit-logs">
                <h3>Network Logs (Auditor View)</h3>
                <div id="log-list" class="log-container">
                    <div class="log-entry info">System ready. Waiting for transaction...</div>
                </div>
            </div>
        </section>

        <section class="right-col">
            <div class="ledger-box highlight">
                <div class="ledger-tag active">Consensus Ledger (Triple-Entry)</div>
                <div id="blockchain-list" class="entry-list"></div>
                <div class="ledger-stats">
                    <span>Block Height: <b id="block-height">0</b></span>
                    <span>State: <b style="color: #10b981">Synchronized</b></span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
